# PokéDrop NZ: which shops to watch and how.
#
# Secrets use ${NAME} and are read from environment variables
# (GitHub Secrets, or a .env file next to this one when running locally).
#
# Adapters:
#   shopify      reads /products.json (fast, reliable, includes stock)
#   woocommerce  reads the public WooCommerce Store API
#   squarespace  reads ?format=json on shop pages
#   html         reads product data embedded in normal web pages
#                (add `render: true` for JavaScript-heavy sites)
#
# Not sure which to use? Run:  python -m pokedrop detect https://shop.co.nz/pokemon-page

settings:
  source: github               # names this scanner on the website, so two scanners never overwrite each other
  release_dates: true          # read release dates from pre-order pages (each checked at most once a day)
  price_drop_percent: 5        # alert when a price falls by at least this much
  cooldown_minutes: 60         # don't repeat the same alert for an item within this window
  min_delay_seconds: 2         # pause between requests to the same shop
  respect_robots_txt: true     # leave this on
  alert_after_failures: 6      # tell the health channel if a shop keeps failing
  forget_after_days: 45
  parallel_stores: 6
  filter:
    include: [pokemon]         # accents are ignored, so this matches Pokémon
    # exclude: [...]           # uncomment to replace the built-in list (plush, figures, books ...)
    min_price: 4               # skips single cards and accessories under NZ$4

discord:
  webhook: ${DISCORD_WEBHOOK}             # main alerts channel
  health_webhook: ${DISCORD_HEALTH_WEBHOOK} # optional: tells you when a shop stops scanning
  webhooks:                               # optional: send some alert types to their own channel
    preorder: ${DISCORD_PREORDER_WEBHOOK}
  roles:                                  # optional: role IDs to ping (Server Settings > Roles > Copy ID)
    preorder: ${DISCORD_ROLE_PREORDER}
    restock: ${DISCORD_ROLE_RESTOCK}
  events: [preorder, new, restock, price_drop]
  english_webhook: ${DISCORD_ENGLISH_WEBHOOK}  # optional: a copy of every English-print alert, without pings
  japanese_webhook: ${DISCORD_JAPANESE_WEBHOOK} # optional: the same for Japanese prints
  chinese_webhook: ${DISCORD_CHINESE_WEBHOOK}   # optional: the same for Chinese prints
  username: PokéDrop NZ

wordpress:
  url: ${WP_URL}               # e.g. https://drops.example.co.nz
  secret: ${WP_SECRET}         # same value as in the WordPress plugin settings
  send_status: true

stores:
  # ---------------------------------------------------------------- Shopify
  - id: gametree
    name: The Game Tree
    url: https://thegametree.co.nz
    adapter: shopify
    pokemon_only: true         # these collections only hold Pokémon
    collections:
      - blisters-and-booster-packs-english
      - blisters-and-booster-packs-japanese
      - booster-boxes-and-cases-english
      - booster-boxes-and-cases-japanese
      - elite-trainer-boxes-collections-and-tins

  - id: tcgcollector
    name: TCG Collector NZ
    url: https://tcgcollectornz.com
    adapter: shopify
    pokemon_only: true
    collections:
      - pokemon-tcg-collector-nz
      - pokemon-tcg-japanese

  - id: otakumart
    name: Otakumart
    url: https://otakumart.co.nz
    adapter: shopify
    pokemon_only: true         # sealed Pokémon collections only (their full shop is 5,000+ items)
    preorder_collections: [pre-order-pokemon-tcg]   # everything in here is a pre-order
    collections:
      - pre-order-pokemon-tcg
      - pokemon-tcg-booster-boxes
      - pokemon-tcg-booster-packs
      - pokemon-tcg-booster-cases
      - pokemon-tcg-elite-trainer-boxes
      - pokemon-tcg-collections
      - pokemon-tcg-tins
      - pokemon-tcg-decks
      - japanese-pokemon-tcg

  # A Christchurch shop: its website sells from the shop's own shelves, so
  # website stock is shown as shop stock on the Canterbury page (location).
  - id: cardmerchantchch
    name: Card Merchant Christchurch
    url: https://cardmerchantchristchurch.co.nz
    adapter: shopify
    collections: [pokemon-sealed]
    filter:
      drop: [ticket, tickets, entry, registration]   # event tickets share the sealed collection
    location:
      name: Card Merchant Christchurch
      address: 7/300 Lincoln Road, Addington, Christchurch 8024
      region: Canterbury

  # ------------------------------------------------ NZ hobby shops (Shopify)
  # Found through DropNZ's shop list and checked one by one: each watches the
  # shop's sealed Pokémon collections only (no singles). A new shop's first
  # scan just records what it has, so adding these sends no alerts until
  # something actually changes.

  - id: aniverse
    name: Aniverse
    url: https://aniverse.co.nz
    adapter: shopify
    collections: [pokemon]

  - id: boostergames
    name: Booster Games
    url: https://www.boostergames.co.nz
    adapter: shopify
    pokemon_only: true         # titles often leave out the word Pokémon
    collections: [pokemon-tcg]

  - id: cardbot
    name: Cardbot
    url: https://cardbot.co.nz
    adapter: shopify
    collections: [pokemon]

  - id: cardmasters
    name: Card Masters
    url: https://cardmasters.co.nz
    adapter: shopify
    collections: [pokemon]

  - id: cardmerchanthamilton
    name: Card Merchant Hamilton
    url: https://cardmerchanthamilton.co.nz
    adapter: shopify
    collections: [pokemon-sealed]
    filter:
      drop: [ticket, tickets, entry, registration]   # event tickets share the collection

  - id: cardmerchanttauranga
    name: Card Merchant Tauranga
    url: https://cardmerchanttauranga.co.nz
    adapter: shopify
    collections: [pokemon-sealed]
    filter:
      drop: [ticket, tickets, entry, registration]   # event tickets share the collection

  - id: cardmerchantwellington
    name: Card Merchant Wellington
    url: https://cardmerchantwellington.co.nz
    adapter: shopify
    collections: [pokemon]
    filter:
      drop: [ticket, tickets, entry, registration]   # event tickets share the collection

  - id: cardtopia
    name: Cardtopia
    url: https://www.cardtopia.co.nz
    adapter: shopify
    preorder_collections: [pokemon-english-pre-orders]
    collections: [pokemon-english-pre-orders, pokemon-collection-box, booster-packs-and-boxes, pokemon-japanese-booster-box-packs, pokemon-japanese-special-box]

  - id: gamecorner
    name: Game Corner
    url: https://gamecorner.co.nz
    adapter: shopify
    collections: [pokemon]

  - id: kidzstuff
    name: Kidz Stuff Online
    url: https://kidzstuffonline.co.nz
    adapter: shopify
    collections: [pokemon-products]

  - id: kollectaka
    name: Kollectaka
    url: https://kollectaka.co.nz
    adapter: shopify
    collections: [chinese-tcg, japanese-tcg]

  - id: mrtofu
    name: Mr Tofu
    url: https://mrtofu.store
    adapter: shopify
    collections: [pokemon-tcg, pokemon-tcg-japanese]

  - id: parkocards
    name: Parko Cards
    url: https://parkocards.co.nz
    adapter: shopify
    collections: [pokemon-booster-boxes-and-packs]

  - id: playx
    name: PlayX
    url: https://www.playx.co.nz
    adapter: shopify
    collections: [pokemon, pokemon-2]
    filter:
      drop: [model kit]   # Pokémon model kits share the collection

  - id: prospernz
    name: Prosper NZ
    url: https://prospernz.com
    adapter: shopify
    collections: [pokemon-new]

  - id: razorleaf
    name: Razorleaf
    url: https://www.razorleaf.co.nz
    adapter: shopify
    collections: [pokemon]

  - id: shuffleandcut
    name: Shuffle & Cut Games
    url: https://www.shuffleandcutgames.co.nz
    adapter: shopify
    collections: [pokemon-sealed]

  - id: toytime
    name: Toy Time
    url: https://www.toytime.co.nz
    adapter: shopify
    collections: [pokemon-tcg, pokemon-chinese, pokemon-japanese]
    filter:
      drop: [ticket, tickets]   # event tickets share the collection
    # Christchurch shop, so it shows on the Canterbury page. Its online stock may
    # include its Lincoln warehouse, so the page labels it as website stock.
    location:
      name: Toy Time
      address: Shop 9, The Colombo, 363 Colombo Street, Sydenham, Christchurch
      region: Canterbury

  # Hobby Lords isn't on Shopify and has no schema.org data, so this reads the
  # product tiles on its Pokémon category page (layout checked with their OK,
  # October 2026). "Load More" is JavaScript, so only the first 36 are read.
  - id: hobbylords
    name: Hobby Lords
    url: https://hobbylords.com
    adapter: html
    missing_means_sold_out: false
    pages: ["/nz/shop/category/2/pokemon?pc_level_1=&pc_level_2=120"]
    filter:
      drop: [sleeves, "deck box", playmat]
    selectors:
      item: .product-card-container
      title: .gb-pc-name
      link: 'a[href*="/products/single/"]'
      price: .gb-pc-price
      image: img
      buy_button: .gb-pc-cta
      available_text: ["add to cart", "pre-order", "preorder"]

  - id: toyworld
    name: Toyworld
    url: https://www.toyworld.co.nz
    adapter: shopify
    collections:               # their whole shop is 10,000+ items; Pokémon cards are filed here
      - trading-cards           # (their "pokemon" collection is mostly toys and watches)

  # ------------------------------------------------------------ Squarespace
  - id: collectallday
    name: Collect All Day
    url: https://www.collectallday.com
    adapter: squarespace
    pokemon_only: true
    pages:
      - /pokemon-booster-boxes
      - /booster-packs
      - /elite-trainer-boxes
      - /sealed-products
      - /new

  # ------------------------------------------------- JB Hi-Fi and Farmers
  # JB Hi-Fi runs on Shopify, but its category pages are filled in by
  # JavaScript, so the scanner opens the page in a headless browser and reads
  # the product cards. Needs Playwright (already switched on in the workflow).
  - id: jbhifi
    name: JB Hi-Fi NZ
    url: https://www.jbhifi.co.nz
    adapter: html
    render: true
    pokemon_only: true
    missing_means_sold_out: true   # the page lists every Pokémon product, so one that disappears has gone
    pages: [/collections/collectibles-merchandise/pokemon-trading-cards]
    selectors:
      item: .ProductCard
      title: "[data-testid=product-card-title]"
      link: "a[data-testid=product-card-content-link]"
      price: "[data-testid=ticket-price]"
      image: img
      buy_button: "[data-testid=product-card-actions]"
      available_text: ["add to cart", "pre-order"]

  # Farmers' category tiles don't show stock, so the scanner reads the first
  # page of Trading Cards (newest first), then opens each Pokémon product to
  # check stock. Farmers' robots.txt blocks its sorting and paging links, so
  # only the first 24 items are read, which is where new releases appear.
  # Farmers blocks requests from cloud servers such as GitHub's, so it's off
  # here. It works from a home connection: switch it on if you run the
  # scanner on a Raspberry Pi or your own computer.
  - id: farmers
    name: Farmers
    url: https://www.farmers.co.nz
    adapter: html
    enabled: false             # turns away GitHub, cPanel and a home connection
    render: true
    missing_means_sold_out: false
    pages: [/toys/games-cards-puzzles/trading-cards]
    detail_pages: true
    selectors:
      item: .product-tile
      title: .product-title-span
      link: a.product-title
      price: .current-price
      image: img.product-image

  # -------------------------------------------- big-box retailers (custom)
  # These sites are custom builds. Run `detect` on their Pokémon category page,
  # then set `enabled: true`. Some use bot protection and may need `render: true`.
  # The Warehouse lists Pokémon cards on one category page. Each tile says
  # whether it can be ordered online; "Find in-store" items count as sold out.
  # Its robots.txt blocks site search, so the category page is used instead.
  # The Warehouse blocks requests from cloud servers such as GitHub's, so it's
  # off here. It works from a home connection: switch it on if you run the
  # scanner on a Raspberry Pi or your own computer.
  - id: warehouse
    name: The Warehouse
    url: https://www.thewarehouse.co.nz
    adapter: html
    enabled: false
    pokemon_only: true
    missing_means_sold_out: false
    pages: [/c/official-merchandise/pok%C3%A9mon/pokemon-trading-cards]
    selectors:
      item: .product-tile
      title: a.link
      link: a.link
      price: "[data-test-id=price]"
      image: img.tile-image
      in_stock: '.availability-stock-status[data-orderable="true"]'

  - id: mightyape
    name: Mighty Ape
    url: https://www.mightyape.co.nz
    adapter: html
    enabled: false
    missing_means_sold_out: false
    pages: [/mn/pokemon/]

  - id: kmart
    name: Kmart NZ
    url: https://www.kmart.co.nz
    adapter: kmart
    enabled: false             # turns away GitHub, cPanel and a home connection
    missing_means_sold_out: false
    pages: [/category/toys/pokemon-trading-cards/]

  # Whitcoulls has no Pokémon cards online yet, so this watches its trading
  # card page and alerts the first ones it lists (alert_from_start). Products
  # come from the data in the page; in-store-only stock counts as available.
  - id: whitcoulls
    name: Whitcoulls
    url: https://www.whitcoulls.co.nz
    adapter: whitcoulls
    enabled: false             # turns away GitHub's servers (406), so it runs from cPanel (stores-cpanel.yaml)
    alert_from_start: true
    missing_means_sold_out: true
    pages: [/games-puzzles/games/collectible-cards]

  # Add more shops by copying an entry above. Ideas: Paper Plus,
  # EB Games, Pokémon Center NZ (heavily bot-protected) and your local game stores.
