name: Scan for Pokémon drops

on:
  schedule:
    # Every 10 minutes, at 3, 13, 23... past the hour. Avoiding :00, :10 and so on
    # dodges GitHub's busiest moments, when scheduled runs get delayed or dropped.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:      # adds a "Run workflow" button for manual scans
    inputs:
      test_alert:
        description: "Send a test alert to Discord instead of scanning"
        type: boolean
        default: false

permissions:
  contents: write         # lets the job save data/state.json back to the repo

concurrency:
  group: pokedrop-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      # The newest main, not the commit that was current when this run was queued:
      # a run that waits behind another would otherwise start from an old scan state.
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Headless browser for stores with `render: true` (JB Hi-Fi). Remove if you drop those.
      # The install sometimes fails or stalls on a busy package mirror; it's tried twice,
      # given at most 3 minutes, and if it still fails the scan goes ahead anyway (only
      # JB Hi-Fi misses that round). Test alerts don't need it, so they skip it.
      - name: Install headless browser
        if: ${{ inputs.test_alert != true }}
        continue-on-error: true
        timeout-minutes: 3
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium || { sleep 20; python -m playwright install --with-deps chromium; }

      - name: Scan
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_HEALTH_WEBHOOK: ${{ secrets.DISCORD_HEALTH_WEBHOOK }}
          DISCORD_PREORDER_WEBHOOK: ${{ secrets.DISCORD_PREORDER_WEBHOOK }}
          DISCORD_PRICE_DROP_WEBHOOK: ${{ secrets.DISCORD_PRICE_DROP_WEBHOOK }}
          DISCORD_ENGLISH_WEBHOOK: ${{ secrets.DISCORD_ENGLISH_WEBHOOK }}
          DISCORD_JAPANESE_WEBHOOK: ${{ secrets.DISCORD_JAPANESE_WEBHOOK }}
          DISCORD_CHINESE_WEBHOOK: ${{ secrets.DISCORD_CHINESE_WEBHOOK }}
          DISCORD_ROLE_PREORDER: ${{ secrets.DISCORD_ROLE_PREORDER }}
          DISCORD_ROLE_RESTOCK: ${{ secrets.DISCORD_ROLE_RESTOCK }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_SECRET: ${{ secrets.WP_SECRET }}
        run: |
          if [ "${{ inputs.test_alert }}" = "true" ]; then
            python -m pokedrop test-discord
          else
            python -m pokedrop scan
          fi

      - name: Save state
        run: |
          git config user.name "pokedrop-bot"
          git config user.email "pokedrop-bot@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Update scan state [skip ci]"
          # If another run saved the state while this one was scanning, this run's copy
          # is the newer one, so it wins (-X theirs keeps the commit being replayed).
          for attempt in 1 2 3; do
            git push -q origin HEAD:main && exit 0
            git fetch -q origin main
            git rebase -q -X theirs origin/main
          done
          exit 1
