name: Scan for Pokémon drops

on:
  schedule:
    # Every 10 minutes. GitHub may run scheduled jobs a few minutes late at busy times.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}   # adds a "Run workflow" button for manual scans

permissions:
  contents: write         # lets the job save data/state.json back to the repo

concurrency:
  group: pokedrop-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Headless browser for stores with `render: true` (JB Hi-Fi). Remove if you drop those.
      - run: pip install playwright && python -m playwright install --with-deps chromium

      - name: Scan
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_HEALTH_WEBHOOK: ${{ secrets.DISCORD_HEALTH_WEBHOOK }}
          DISCORD_PREORDER_WEBHOOK: ${{ secrets.DISCORD_PREORDER_WEBHOOK }}
          DISCORD_ROLE_PREORDER: ${{ secrets.DISCORD_ROLE_PREORDER }}
          DISCORD_ROLE_RESTOCK: ${{ secrets.DISCORD_ROLE_RESTOCK }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_SECRET: ${{ secrets.WP_SECRET }}
        run: python -m pokedrop scan

      - name: Save state
        run: |
          git config user.name "pokedrop-bot"
          git config user.email "pokedrop-bot@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet || git commit -m "Update scan state [skip ci]"
          git pull --rebase --autostash || true
          git push
