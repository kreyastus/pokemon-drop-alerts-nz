# PokéDrop NZ: shop list for a scanner on a home connection (the Docker set-up
# in docker/). Farmers and Kmart turn away cloud and hosting servers, so they
# are scanned from here; every other shop is scanned by GitHub (stores.yaml)
# or the cPanel server (stores-cpanel.yaml), so no alert is sent twice.
#
# Only public pages that each shop's robots.txt allows are read, the scanner
# says who it is in every request, and nothing tries to get past a block.
# If a shop starts refusing these requests, its scans fail and the health
# channel says so: switch that shop off (enabled: false) rather than working
# round it.
#
# 22 October 2026: both shops turned away a home connection too (Farmers sent
# its block page, Kmart a 403), so both are switched off.

settings:
  source: home                 # names this scanner on the website, so scanners never overwrite each other
  release_dates: false         # pre-order dates come from the other scanners
  price_drop_percent: 5
  cooldown_minutes: 60
  min_delay_seconds: 3         # a little gentler than the other scanners
  respect_robots_txt: true
  alert_after_failures: 6
  forget_after_days: 45
  parallel_stores: 1
  filter:
    include: [pokemon]
    min_price: 4

discord:
  webhook: ${DISCORD_WEBHOOK}
  health_webhook: ${DISCORD_HEALTH_WEBHOOK}
  english_webhook: ${DISCORD_ENGLISH_WEBHOOK}   # optional: English prints only
  japanese_webhook: ${DISCORD_JAPANESE_WEBHOOK} # optional: Japanese prints only
  chinese_webhook: ${DISCORD_CHINESE_WEBHOOK}   # optional: Chinese prints only
  roles:
    preorder: ${DISCORD_ROLE_PREORDER}
    restock: ${DISCORD_ROLE_RESTOCK}
  events: [preorder, new, restock, price_drop]
  username: PokéDrop NZ

wordpress:
  url: ${WP_URL}
  secret: ${WP_SECRET}

stores:
  # Farmers: the trading-cards page lists the products and each product page
  # gives its online stock. Only the first page of the category is read,
  # because robots.txt rules out the address of the second page.
  - id: farmers
    name: Farmers
    url: https://www.farmers.co.nz
    adapter: html
    enabled: false             # blocked from home too (22 October 2026)
    every_minutes: 20
    missing_means_sold_out: false
    pages: [/toys/games-cards-puzzles/trading-cards]
    detail_pages: true
    selectors:
      item: .product-tile
      title: .product-title-span
      link: a.product-title
      price: .current-price
      image: img.product-image

  # Kmart: the Pokémon cards page lists the products; each product page says
  # whether it can be bought online. Product pages are large, so each is read
  # at most every 6 hours (new products straight away).
  - id: kmart
    name: Kmart NZ
    url: https://www.kmart.co.nz
    adapter: kmart
    enabled: false             # blocked from home too (22 October 2026)
    every_minutes: 30
    detail_hours: 6
    max_details: 12
    missing_means_sold_out: false
    pages: [/category/toys/pokemon-trading-cards/]
